# ForwardCheck on this machine. Secrets come from .env (never baked into the image).
#   docker compose up -d --build     start / update
#   docker compose logs -f app       watch
#   docker compose down              stop (the database volume is kept)
services:
  app:
    build: .
    env_file: .env
    environment:
      # The container's own settings win over .env's local-dev values.
      PORT: "3000"
      DATABASE_PATH: /data/forwardcheck.db
      NODE_ENV: production
      # The address in the links the bot sends. scripts/tunnel-up.sh sets it to the tunnel's address.
      BASE_URL: ${BASE_URL:-http://localhost:3100}
    ports:
      # Loopback only: ngrok is the way in from outside.
      - "127.0.0.1:3100:3000"
    volumes:
      - forwardcheck-data:/data
    restart: unless-stopped

  # A Cloudflare quick tunnel: a public https address for the app, no account needed.
  # The address is new each time this container starts; scripts/tunnel-up.sh reads it from the log.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on: [app]
    restart: unless-stopped

volumes:
  forwardcheck-data:
