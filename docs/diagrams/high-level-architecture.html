<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>High-level Architecture of ForwardCheck-AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #F5F0EB;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .diagram-wrapper {
      width: 100%;
      max-width: 1200px;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="diagram-wrapper">
    <svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow-right" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#555"/>
        </marker>
        <marker id="arrow-left" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
          <polygon points="8 0, 0 3, 8 6" fill="#555"/>
        </marker>
        <marker id="arrow-down" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
          <polygon points="0 0, 6 0, 3 8" fill="#555"/>
        </marker>
        <marker id="arrow-up" markerWidth="6" markerHeight="8" refX="3" refY="0" orient="auto">
          <polygon points="0 8, 6 8, 3 0" fill="#555"/>
        </marker>
        <style>
          text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
        </style>
      </defs>

      <!-- Background -->
      <rect width="1200" height="660" fill="#F5F0EB" rx="0"/>

      <!-- ============================================ -->
      <!-- TITLE                                        -->
      <!-- ============================================ -->
      <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1A1A1A" letter-spacing="-0.5">
        High-level Architecture of ForwardCheck-AI
      </text>

      <!-- ============================================ -->
      <!-- SECTION LABELS                               -->
      <!-- ============================================ -->
      <text x="165" y="86" text-anchor="middle" font-size="17" font-weight="600" fill="#1A1A1A">
        Telegram
      </text>
      <text x="770" y="86" text-anchor="middle" font-size="17" font-weight="600" fill="#1A1A1A">
        Multi-agent Fact-Checking Pipeline
      </text>

      <!-- ============================================ -->
      <!-- LEFT SECTION: Telegram Chat Mockup           -->
      <!-- ============================================ -->

      <!-- Bot icon (Telegram blue circle with plane icon) -->
      <circle cx="58" cy="130" r="18" fill="#0088CC"/>
      <text x="58" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#FFF">&#9992;</text>

      <!-- Bot name -->
      <text x="84" y="125" font-size="14" font-weight="600" fill="#1A1A1A">ForwardCheck-AI</text>
      <text x="84" y="143" font-size="11" fill="#999">Fact-checking bot</text>

      <!-- Prompt text -->
      <text x="84" y="170" font-size="11.5" fill="#888" font-weight="500">
        Forward a message to fact-check
      </text>

      <!-- User avatar -->
      <circle cx="58" cy="218" r="15" fill="#C4C4C4"/>
      <text x="58" y="222" text-anchor="middle" font-size="11" fill="#FFF" font-weight="600">U</text>

      <!-- Forwarded message text -->
      <text x="82" y="200" font-size="10" fill="#999" font-weight="500" font-style="italic">Forwarded message</text>
      <text font-size="11" fill="#555">
        <tspan x="82" y="216">"COVID vaccines contain</tspan>
        <tspan x="82" dy="15">microchips that allow the</tspan>
        <tspan x="82" dy="15">government to track your</tspan>
        <tspan x="82" dy="15">movements, according to</tspan>
        <tspan x="82" dy="15">a leaked WHO document."</tspan>
      </text>

      <!-- Bot verdict reply -->
      <circle cx="58" cy="330" r="15" fill="#0088CC"/>
      <text x="58" y="334" text-anchor="middle" font-size="11" fill="#FFF" font-weight="700">&#9992;</text>

      <text x="82" y="318" font-size="10" fill="#999" font-weight="500">Verdict</text>
      <text font-size="11" fill="#555">
        <tspan x="82" y="334" font-weight="600" fill="#D32F2F">Likely False</tspan>
        <tspan font-weight="400" fill="#555"> (confidence: 92)</tspan>
        <tspan x="82" dy="16">No credible evidence supports</tspan>
        <tspan x="82" dy="15">the microchip claim. Multiple</tspan>
        <tspan x="82" dy="15">fact-checkers have debunked</tspan>
        <tspan x="82" dy="15">this claim since 2020.</tspan>
        <tspan x="82" dy="18" fill="#0088CC" font-weight="500">View full analysis &#8594;</tspan>
      </text>

      <!-- ============================================ -->
      <!-- ARROWS BETWEEN SECTIONS                      -->
      <!-- ============================================ -->

      <!-- Forwarded message arrow (right) -->
      <line x1="310" y1="210" x2="435" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-right)"/>
      <text x="372" y="200" text-anchor="middle" font-size="11" fill="#888">Forwarded message</text>

      <!-- Verdict arrow (left) -->
      <line x1="435" y1="340" x2="310" y2="340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-left)"/>
      <text x="372" y="330" text-anchor="middle" font-size="11" fill="#888">Verdict</text>

      <!-- ============================================ -->
      <!-- SEARCH APIs BOX (left of orchestrator)       -->
      <!-- Equivalent to Anthropic's "Citations subagent" -->
      <!-- ============================================ -->
      <rect x="370" y="410" width="150" height="115" rx="8" fill="#FFF" stroke="#CFCFCF" stroke-width="1"/>
      <text x="445" y="445" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A1A">Search APIs</text>
      <line x1="400" y1="457" x2="490" y2="457" stroke="#E8E8E8" stroke-width="0.75"/>
      <text x="445" y="477" text-anchor="middle" font-size="11" fill="#666">Brave Web Search</text>
      <text x="445" y="496" text-anchor="middle" font-size="11" fill="#666">Google Fact Check</text>

      <!-- ============================================ -->
      <!-- PIPELINE ORCHESTRATOR (large blue box)       -->
      <!-- Equivalent to Anthropic's "Lead agent"       -->
      <!-- ============================================ -->
      <rect x="545" y="115" width="430" height="195" rx="12" fill="#DAEAF6"/>

      <!-- Title -->
      <text x="760" y="152" text-anchor="middle" font-size="16" font-weight="600" fill="#1A1A1A">
        Pipeline Orchestrator
      </text>

      <!-- Stages description -->
      <text x="760" y="182" text-anchor="middle" font-size="12" fill="#555">
        Stages: classify &#8594; strategize &#8594; investigate
      </text>
      <text x="760" y="200" text-anchor="middle" font-size="12" fill="#555">
        &#8594; challenge &#8594; judge
      </text>

      <!-- Separator -->
      <line x1="620" y1="218" x2="900" y2="218" stroke="#B8CBE0" stroke-width="0.75"/>

      <!-- Model tiers -->
      <text x="760" y="240" text-anchor="middle" font-size="11.5" fill="#777">
        Models: Haiku (routing) &#183; Sonnet (search)
      </text>
      <text x="760" y="258" text-anchor="middle" font-size="11.5" fill="#777">
        &#183; Opus (reasoning)
      </text>

      <!-- Tools line -->
      <text x="760" y="284" text-anchor="middle" font-size="10.5" fill="#999">
        Tools: brave_search + google_factcheck + submit_*
      </text>

      <!-- ============================================ -->
      <!-- DATA STORAGE BOX (right of orchestrator)     -->
      <!-- Equivalent to Anthropic's "Memory"           -->
      <!-- ============================================ -->
      <rect x="1005" y="165" width="155" height="100" rx="8" fill="#FFF" stroke="#CFCFCF" stroke-width="1"/>
      <text x="1082" y="200" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A1A">Data Storage</text>
      <line x1="1025" y1="212" x2="1140" y2="212" stroke="#E8E8E8" stroke-width="0.75"/>
      <text x="1082" y="232" text-anchor="middle" font-size="11" fill="#666">SQLite + Claim Cache</text>

      <!-- ============================================ -->
      <!-- 3 INVESTIGATORS (pill shapes, light blue)    -->
      <!-- Equivalent to Anthropic's "Search subagent"s -->
      <!-- ============================================ -->

      <!-- Source Verifier -->
      <rect x="555" y="400" width="138" height="62" rx="31" fill="#DAEAF6"/>
      <text x="624" y="425" text-anchor="middle" font-size="12" font-weight="500" fill="#1A1A1A">Source Verifier</text>
      <text x="624" y="443" text-anchor="middle" font-size="10" fill="#777">(Sonnet 4.5)</text>

      <!-- Domain Expert -->
      <rect x="710" y="400" width="138" height="62" rx="31" fill="#DAEAF6"/>
      <text x="779" y="425" text-anchor="middle" font-size="12" font-weight="500" fill="#1A1A1A">Domain Expert</text>
      <text x="779" y="443" text-anchor="middle" font-size="10" fill="#777">(Sonnet 4.5)</text>

      <!-- Pattern Matcher -->
      <rect x="865" y="400" width="138" height="62" rx="31" fill="#DAEAF6"/>
      <text x="934" y="425" text-anchor="middle" font-size="12" font-weight="500" fill="#1A1A1A">Pattern Matcher</text>
      <text x="934" y="443" text-anchor="middle" font-size="10" fill="#777">(Sonnet 4.5)</text>

      <!-- ============================================ -->
      <!-- CONNECTING ARROWS                            -->
      <!-- ============================================ -->

      <!-- Pipeline Orchestrator ↔ Data Storage (horizontal bidirectional) -->
      <!-- Right arrow -->
      <line x1="975" y1="205" x2="1005" y2="205" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-right)"/>
      <!-- Left arrow -->
      <line x1="1005" y1="225" x2="975" y2="225" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-left)"/>

      <!-- Pipeline Orchestrator → Source Verifier (down + up pair) -->
      <line x1="618" y1="310" x2="618" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-down)"/>
      <line x1="630" y1="400" x2="630" y2="310" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-up)"/>

      <!-- Pipeline Orchestrator → Domain Expert (down + up pair) -->
      <line x1="773" y1="310" x2="773" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-down)"/>
      <line x1="785" y1="400" x2="785" y2="310" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-up)"/>

      <!-- Pipeline Orchestrator → Pattern Matcher (down + up pair) -->
      <line x1="928" y1="310" x2="928" y2="400" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-down)"/>
      <line x1="940" y1="400" x2="940" y2="310" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-up)"/>

      <!-- Pipeline Orchestrator ↔ Search APIs -->
      <!-- Down-left from orchestrator to Search APIs -->
      <line x1="570" y1="310" x2="490" y2="430" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-right)" transform="rotate(0)"/>
      <!-- Actually let me use a path for cleaner routing -->
      <path d="M 565 310 L 520 410" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow-down)"/>
      <path d="M 508 410 L 555 310" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow-up)"/>

      <!-- Search APIs ↔ Investigators (horizontal arrows) -->
      <line x1="520" y1="440" x2="555" y2="440" stroke="#555" stroke-width="1.5" marker-end="url(#arrow-right)"/>

      <!-- ============================================ -->
      <!-- ANNOTATION: 3-Tier Model Labels              -->
      <!-- ============================================ -->

      <!-- Haiku tier indicator on Classifier mention -->
      <rect x="555" y="530" width="448" height="85" rx="8" fill="none" stroke="#D5D0CB" stroke-width="1" stroke-dasharray="4 3"/>

      <!-- Model tier legend -->
      <text x="780" y="552" text-anchor="middle" font-size="11" font-weight="600" fill="#888">3-Tier Model Strategy</text>

      <!-- Haiku -->
      <circle cx="610" cy="575" r="6" fill="#4CAF50"/>
      <text x="622" y="579" font-size="10.5" fill="#666">
        <tspan font-weight="600">Haiku 4.5</tspan>
        <tspan> &#8212; routing</tspan>
      </text>

      <!-- Sonnet -->
      <circle cx="745" cy="575" r="6" fill="#2196F3"/>
      <text x="757" y="579" font-size="10.5" fill="#666">
        <tspan font-weight="600">Sonnet 4.5</tspan>
        <tspan> &#8212; search</tspan>
      </text>

      <!-- Opus -->
      <circle cx="890" cy="575" r="6" fill="#9C27B0"/>
      <text x="902" y="579" font-size="10.5" fill="#666">
        <tspan font-weight="600">Opus 4.6</tspan>
        <tspan> &#8212; reasoning</tspan>
      </text>

      <!-- Cost annotation -->
      <text x="780" y="600" text-anchor="middle" font-size="10" fill="#AAA">
        ~$2&#8211;5 per investigation &#183; 30&#8211;70s latency
      </text>

    </svg>
  </div>
</body>
</html>
